name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod requires Go 1.25; the incremental-compile performance test
        # (2x threshold) is flaky on slower runners under older Go versions.
        go: ['1.25']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build (excluding examples/ — tutorial .go files are package main)
        run: go build $(go list ./... | grep -v '/examples')

      - name: Test (16 packages, excluding generated tutorial .go files)
        # -short: skip the incremental-compile 2x speed assertion (flaky on CI).
        run: go test -short $(go list ./... | grep -v '/examples') -timeout 120s

      - name: Vet (excluding examples/)
        run: go vet $(go list ./... | grep -v '/examples')

      - name: Build CLI
        run: go build -o kylix ./cmd/kylix/

      - name: Test stdlib (Kylix-level)
        run: |
          ./kylix test stdlib/src/strutil_test.klx
          ./kylix test stdlib/src/mathutil_test.klx
          ./kylix test stdlib/src/arrayutil_test.klx
          ./kylix test stdlib/src/collections_test.klx

  tutorials:
    name: Tutorials (Go backend, linux amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build CLI
        run: go build -o kylix ./cmd/kylix/

      - name: "Run tutorials (Go backend compile, then go run)"
        run: KYLIX=$PWD/kylix bash examples/complete-tutorial/test_all.sh

  tutorials-arm64:
    name: Tutorials (Go backend, linux arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build CLI
        run: go build -o kylix ./cmd/kylix/

      - name: "Run tutorials (Go backend compile, then go run)"
        run: KYLIX=$PWD/kylix bash examples/complete-tutorial/test_all.sh

  llvm-tutorials:
    name: Tutorials (LLVM backend, linux amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install LLVM toolchain + stdlib native libs
        # llc/clang drive the LLVM backend; libsqlite3/libcurl/libssl are the
        # system libs it links for the db/httpclient/crypto stdlib modules.
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libsqlite3-dev libcurl4-openssl-dev libssl-dev libgc-dev time

      - name: Build CLI
        run: go build -o kylix ./cmd/kylix/

      - name: "Run tutorials (LLVM backend → native binary, run, cleanup)"
        run: KYLIX=$PWD/kylix bash examples/complete-tutorial/test_all_llvm.sh

      - name: "Boehm GC E2E: example64 with --gc=boehm + bounded maxRSS"
        # v0.10.0 P0 (issue #1): prove the Boehm mode actually reclaims — the
        # example allocates ~60MB of garbage; with GC the peak RSS must stay
        # far below that. Functional parity is covered by test_all_llvm.sh.
        run: |
          mkdir -p /tmp/gc_check
          cp examples/complete-tutorial/26_memory/example64_gc.klx /tmp/gc_check/
          ./kylix build --backend=llvm --gc=boehm -o /tmp/gc_check/example64_gc /tmp/gc_check/example64_gc.klx
          if /usr/bin/time --version >/dev/null 2>&1; then
            # GNU time (Linux): "Maximum resident set size (kbytes): N"
            /usr/bin/time -v /tmp/gc_check/example64_gc >/tmp/gc_check/out.txt 2>/tmp/gc_check/time.txt
            KB=$(grep "Maximum resident set size" /tmp/gc_check/time.txt | grep -o "[0-9]*" | tail -1)
          else
            # BSD time (macOS): "<bytes>  maximum resident set size"
            /usr/bin/time -l /tmp/gc_check/example64_gc >/tmp/gc_check/out.txt 2>/tmp/gc_check/time.txt
            B=$(grep "maximum resident set size" /tmp/gc_check/time.txt | grep -o "[0-9]*" | tail -1)
            KB=$((B / 1024))
          fi
          echo "maxRSS: ${KB} KB"
          tail -2 /tmp/gc_check/out.txt
          if [ -z "$KB" ] || [ "$KB" -lt 1 ] || [ "$KB" -gt 131072 ]; then
            echo "maxRSS ${KB}KB outside the 128MB bound — GC not reclaiming?"
            exit 1
          fi

  llvm-tutorials-arm64:
    name: Tutorials (LLVM backend, linux arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install LLVM toolchain + stdlib native libs
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libsqlite3-dev libcurl4-openssl-dev libssl-dev libgc-dev time

      - name: Build CLI
        run: go build -o kylix ./cmd/kylix/

      - name: "Run tutorials (LLVM backend → native binary, run, cleanup)"
        run: KYLIX=$PWD/kylix bash examples/complete-tutorial/test_all_llvm.sh

  llvm-darwin:
    name: Tutorials (LLVM backend, macos arm64)
    # v0.9.0: darwin was the only platform with zero CI coverage despite
    # being the primary dev machine — run the full LLVM sweep on arm64.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install LLVM toolchain + openssl (brew; sqlite3/curl are system)
        run: |
          brew install llvm openssl@3 bdw-gc
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"

      - name: Build CLI
        run: go build -o kylix ./cmd/kylix/

      - name: "Run tutorials (LLVM backend → native binary, run, cleanup)"
        run: KYLIX=$PWD/kylix bash examples/complete-tutorial/test_all_llvm.sh

      - name: "Boehm GC E2E: example64 with --gc=boehm + bounded maxRSS"
        # v0.10.0 P0 (issue #1): prove the Boehm mode actually reclaims — the
        # example allocates ~60MB of garbage; with GC the peak RSS must stay
        # far below that. Functional parity is covered by test_all_llvm.sh.
        run: |
          mkdir -p /tmp/gc_check
          cp examples/complete-tutorial/26_memory/example64_gc.klx /tmp/gc_check/
          ./kylix build --backend=llvm --gc=boehm -o /tmp/gc_check/example64_gc /tmp/gc_check/example64_gc.klx
          if /usr/bin/time --version >/dev/null 2>&1; then
            # GNU time (Linux): "Maximum resident set size (kbytes): N"
            /usr/bin/time -v /tmp/gc_check/example64_gc >/tmp/gc_check/out.txt 2>/tmp/gc_check/time.txt
            KB=$(grep "Maximum resident set size" /tmp/gc_check/time.txt | grep -o "[0-9]*" | tail -1)
          else
            # BSD time (macOS): "<bytes>  maximum resident set size"
            /usr/bin/time -l /tmp/gc_check/example64_gc >/tmp/gc_check/out.txt 2>/tmp/gc_check/time.txt
            B=$(grep "maximum resident set size" /tmp/gc_check/time.txt | grep -o "[0-9]*" | tail -1)
            KB=$((B / 1024))
          fi
          echo "maxRSS: ${KB} KB"
          tail -2 /tmp/gc_check/out.txt
          if [ -z "$KB" ] || [ "$KB" -lt 1 ] || [ "$KB" -gt 131072 ]; then
            echo "maxRSS ${KB}KB outside the 128MB bound — GC not reclaiming?"
            exit 1
          fi

  llvm-windows:
    name: LLVM backend (Windows native via llvm-mingw)
    runs-on: windows-latest
    env:
      LLVM_MINGW_VER: '20260826'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: "Fetch llvm-mingw (portable zip — v0.6.2 lesson: installers are unreliable)"
        # mstorsjo/llvm-mingw ships the full LLVM toolchain (clang/llc/opt +
        # ld.lld) preconfigured for mingw-w64; it doubles as both the IR
        # toolchain and the native Windows link sysroot (KYLIX_MINGW_ROOT).
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$($env:LLVM_MINGW_VER)/llvm-mingw-$($env:LLVM_MINGW_VER)-ucrt-x86_64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath C:\ -Force
          $root = "C:\llvm-mingw-$($env:LLVM_MINGW_VER)-ucrt-x86_64"
          Add-Content $env:GITHUB_PATH "$root\bin"
          Add-Content $env:GITHUB_ENV "KYLIX_MINGW_ROOT=$root"

      - name: Build CLI
        shell: pwsh
        run: go build -o kylix.exe ./cmd/kylix/

      - name: Doctor (advisory)
        shell: bash
        run: ./kylix.exe doctor || true

      - name: "Compile + run representative tutorials (native Windows .exe)"
        # v0.7.1 P3: real Windows compilation via llvm-mingw (no skip path).
        shell: bash
        run: |
          set -e
          for ex in \
            examples/complete-tutorial/01_basics/example01_hello.klx \
            examples/complete-tutorial/02_control_flow/example07_if_else.klx \
            examples/complete-tutorial/04_oop/example18_class_methods.klx \
            examples/complete-tutorial/07_stdlib_core/example29_basic_funcs.klx; do
            name=$(basename "$ex" .klx)
            ./kylix.exe build --backend=llvm -o "$name.exe" "$ex"
            "./$name.exe"
          done

      - name: "Regex engine (example61, multi-file pure-Kylix unit)"
        shell: bash
        run: |
          set -e
          ./kylix.exe build --backend=llvm -o ex61.exe \
            stdlib/regex_engine.klx \
            examples/complete-tutorial/23_regex/example61_regex_engine.klx
          set +e
          ./ex61.exe > ex61_windows.txt
          rc=$?
          set -e
          echo "ex61 exit=$rc"
          echo "--- output tail ---"
          tail -5 ex61_windows.txt || true
          echo "--- F-miss count: $(grep -c '^F ' ex61_windows.txt || true)"
          echo "--- F-miss lines ---"
          grep -n '^F ' ex61_windows.txt || true
          test "$rc" = "0"
          # Reference output (byte-identical on Go/LLVM/bootstrap ends):
          # 33 lines — 24 ShowMatch scenarios of which 5 are negative and
          # legitimately print "F ..." (^ab|xab, ab$|abx, cat|dog|hotbird,
          # (a|b)*abb|abxa, a{2}|a) → 19 "T ..." + 5 "F ...", plus 4 find-all
          # ("A"), 2 replace ("R"), 2 split ("S") lines, then "done".
          test "$(grep -c '^T ' ex61_windows.txt)" = "19"
          test "$(grep -c '^F ' ex61_windows.txt)" = "5"
          tail -1 ex61_windows.txt | grep -q "done"

      - name: "net smoke: two-process Winsock echo (real-machine acceptance)"
        # P1 acceptance on a real Windows environment: WSAStartup-once +
        # listen/accept/dial/write/read over the Winsock wrappers.
        shell: bash
        run: |
          set -e
          cat > net_listener.klx <<'EOF'
          program NetListener;
          uses net;
          begin
            var l := TcpListen(19733);
            if l = nil then begin WriteLn('listen failed'); exit; end;
            var c := TcpAccept(l);
            if c = nil then begin WriteLn('accept failed'); exit; end;
            var r := TcpRead(c, 64);
            TcpWrite(c, 'echo:' + r);
            TcpClose(c);
            TcpListenerClose(l);
            WriteLn('listener done');
          end.
          EOF
          cat > net_dialer.klx <<'EOF'
          program NetDialer;
          uses net;
          begin
            var c := TcpDial('127.0.0.1', 19733);
            if c = nil then begin WriteLn('dial failed'); exit; end;
            TcpWrite(c, 'hello');
            WriteLn(TcpRead(c, 64));
            TcpClose(c);
          end.
          EOF
          ./kylix.exe build --backend=llvm -o net_listener.exe net_listener.klx
          ./kylix.exe build --backend=llvm -o net_dialer.exe net_dialer.klx
          ./net_listener.exe &
          lpid=$!
          sleep 2
          ./net_dialer.exe
          wait $lpid

  selfrepro:
    name: Self-reproduction IR fixpoint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # LLVM 19 from apt.llvm.org — the distro LLVM 18 miscompiles the
      # ~220k-line bootstrap IR (same reason as the release.yml bootstrap
      # job; see TECHNICAL_DEBT.md).
      - name: Install LLVM 19 toolchain + stdlib native libs
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --yes -o /etc/apt/trusted.gpg.d/llvm.gpg
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update
          sudo apt-get install -y clang-19 llvm-19 libsqlite3-dev libcurl4-openssl-dev libssl-dev
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - name: Build CLI
        run: go build -o kylix ./cmd/kylix/

      # v0.7.2: the fixpoint job validates the v0.6.9 no-Go IR loop
      # (gen1 ≡ gen2, byte-identical ~227k-line IR) instead of the old
      # Go-codegen chain. The Go path is unverified since v0.6.9 — the
      # bootstrap main.go it produced no longer compiles (interface
      # coercion gaps in the Go emitter), see TECHNICAL_DEBT.md.
      - name: Bootstrap IR fixpoint check (gen1 ≡ gen2)
        run: |
          set -e
          FILES="src/token.klx src/error.klx src/ast.klx src/lexer.klx src/parser.klx src/generator.klx src/stdlib_ir.klx src/llvmgen.klx src/main.klx"
          # gen1: host compiler (LLVM backend) builds the bootstrap compiler
          ./kylix build --backend=llvm -o main_self $FILES
          # gen1 emits IR for the bootstrap sources (token-first order —
          # mem2reg is only clean in that order, see v0.7.1 notes)
          ./main_self --emit-llvm $FILES > fp1.ll
          # gen2: mem2reg → llc → clang link → native compiler (no Go)
          opt -passes=mem2reg fp1.ll -S -o fp1_opt.ll
          llc -filetype=obj fp1_opt.ll -o fp1.o
          # -lm: the IR calls fmod (Variant div/mod); Linux ld requires libm
          # explicitly on the command line (macOS libSystem bundles it).
          # -no-pie: llc emits the Static relocation model; Ubuntu clang links
          # PIE by default → "failed to set dynamic section sizes: bad value"
          # (same fix as release.yml's bootstrap smoke).
          libs="-lm"
          grep -q "@__kylix_crypto_\|@EVP_\|@SHA256\|@MD5\|@PKCS5" fp1.ll && libs="$libs -lcrypto" || true
          grep -q "@sqlite3_" fp1.ll && libs="$libs -lsqlite3" || true
          grep -q "@curl_" fp1.ll && libs="$libs -lcurl" || true
          clang fp1.o -no-pie -o gen2 $libs
          # gen2 emits IR for the same sources — must be byte-identical
          ./gen2 --emit-llvm $FILES > fp2.ll
          cmp fp1.ll fp2.ll && echo "self-reproduction IR fixpoint OK (gen1 ≡ gen2)"

  admin-e2e-pg:
    name: KylixAdmin E2E (postgres dialect)
    runs-on: ubuntu-latest
    # v0.12.0 P5c/P5d: the same Kylix sources against postgres on both backends,
    # diffed against each other and against the sqlite transcript — the evidence
    # that the dialect layer makes the business code portable, and that the
    # libpq backend matches the Go one. libpq-dev is needed to link the LLVM
    # form. POSTGRES_INITDB_ARGS pins the C collation: postgres'
    # default (en_US.UTF-8) orders `alice,bob,Zed` where sqlite's BINARY orders
    # `Zed,alice,bob`, which would show up as a spurious row-order diff.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kylix
          POSTGRES_PASSWORD: kylix
          POSTGRES_DB: kyadmin
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install LLVM toolchain + stdlib native libs + psql + libpq
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libsqlite3-dev libcurl4-openssl-dev \
            libssl-dev libgc-dev postgresql-client libpq-dev

      - name: Build CLI
        run: go build -o kylix ./cmd/kylix/

      - name: Run KylixAdmin E2E against postgres
        run: |
          KYLIX=$PWD/kylix \
          PG_DSN="postgres://kylix:kylix@localhost:5432/kyadmin?sslmode=disable" \
          bash apps/admin/e2e.sh --pg

      # The E2E always starts empty, so it only exercises table creation. This
      # covers the other half: an existing partial table must gain the columns
      # the metadata declares.
      - name: Incremental migration check (postgres)
        run: |
          KYLIX=$PWD/kylix \
          PG_DSN="postgres://kylix:kylix@localhost:5432/kyadmin?sslmode=disable" \
          bash apps/admin/migrate_check.sh --pg

  admin-e2e:
    name: KylixAdmin E2E (dual-backend parity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install LLVM toolchain + stdlib native libs
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libsqlite3-dev libcurl4-openssl-dev libssl-dev libgc-dev

      - name: Build CLI
        run: go build -o kylix ./cmd/kylix/

      # v0.10.0 P2 phase 4: the same 12 curl scenarios against the Go and
      # LLVM forms of apps/admin, normalized transcripts diffed. The LLVM
      # form builds with --gc=boehm (long-running server); the script falls
      # back to default malloc when libgc is missing.
      - name: Run KylixAdmin dual-backend E2E
        run: KYLIX=$PWD/kylix bash apps/admin/e2e.sh

      - name: Incremental migration check (sqlite)
        run: KYLIX=$PWD/kylix bash apps/admin/migrate_check.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt (tracked .go files, excluding generated examples/)
        run: |
          fmt_files=$(gofmt -l $(git ls-files '*.go' | grep -v '^examples/') 2>&1)
          if [ -n "$fmt_files" ]; then
            echo "Files not formatted:"
            echo "$fmt_files"
            exit 1
          fi

  perf-gate:
    name: Performance regression gate
    # v0.9.0: loose order-of-magnitude ceilings only — shared runners have
    # ±30% noise, so this catches cache/optimizer/O(n²) blow-ups, not drift.
    # See benchmarks/ci_gate.sh header for what each ceiling catches.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install LLVM toolchain + stdlib native libs
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libsqlite3-dev libcurl4-openssl-dev libssl-dev libgc-dev time

      - name: Run perf gate (compile_time scenarios vs ceilings)
        run: bash benchmarks/ci_gate.sh
