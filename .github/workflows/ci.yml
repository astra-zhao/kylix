name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod requires Go 1.25; the incremental-compile performance test
        # (2x threshold) is flaky on slower runners under older Go versions.
        go: ['1.25']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build (excluding examples/ — tutorial .go files are package main)
        run: go build $(go list ./... | grep -v '/examples')

      - name: Test (16 packages, excluding generated tutorial .go files)
        # -short: skip the incremental-compile 2x speed assertion (flaky on CI).
        run: go test -short $(go list ./... | grep -v '/examples') -timeout 120s

      - name: Vet (excluding examples/)
        run: go vet $(go list ./... | grep -v '/examples')

      - name: Build CLI
        run: go build -o kylix ./cmd/kylix/

      - name: Test stdlib (Kylix-level)
        run: |
          ./kylix test stdlib/src/strutil_test.klx
          ./kylix test stdlib/src/mathutil_test.klx
          ./kylix test stdlib/src/arrayutil_test.klx
          ./kylix test stdlib/src/collections_test.klx

  tutorials:
    name: Tutorials (51 examples)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build CLI
        run: go build -o kylix ./cmd/kylix/

      - name: "Run 51 tutorials (Go backend compile, then go run)"
        run: KYLIX=$PWD/kylix bash examples/complete-tutorial/test_all.sh

  llvm-tutorials:
    name: Tutorials (LLVM backend, 51 examples)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install LLVM toolchain + stdlib native libs
        # llc/clang drive the LLVM backend; libsqlite3/libcurl/libssl are the
        # system libs it links for the db/httpclient/crypto stdlib modules.
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libsqlite3-dev libcurl4-openssl-dev libssl-dev

      - name: Build CLI
        run: go build -o kylix ./cmd/kylix/

      - name: "Run 51 tutorials (LLVM backend → native binary, run, cleanup)"
        run: KYLIX=$PWD/kylix bash examples/complete-tutorial/test_all_llvm.sh

  llvm-windows:
    name: LLVM backend (Windows native via llvm-mingw)
    runs-on: windows-latest
    env:
      LLVM_MINGW_VER: '20260826'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Fetch llvm-mingw (portable zip — v0.6.2 lesson: installers are unreliable)
        # mstorsjo/llvm-mingw ships the full LLVM toolchain (clang/llc/opt +
        # ld.lld) preconfigured for mingw-w64; it doubles as both the IR
        # toolchain and the native Windows link sysroot (KYLIX_MINGW_ROOT).
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$($env:LLVM_MINGW_VER)/llvm-mingw-$($env:LLVM_MINGW_VER)-ucrt-x86_64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath C:\ -Force
          $root = "C:\llvm-mingw-$($env:LLVM_MINGW_VER)-ucrt-x86_64"
          Add-Content $env:GITHUB_PATH "$root\bin"
          Add-Content $env:GITHUB_ENV "KYLIX_MINGW_ROOT=$root"

      - name: Build CLI
        shell: pwsh
        run: go build -o kylix.exe ./cmd/kylix/

      - name: Doctor (advisory)
        shell: bash
        run: ./kylix.exe doctor || true

      - name: "Compile + run representative tutorials (native Windows .exe)"
        # v0.7.1 P3: real Windows compilation via llvm-mingw (no skip path).
        shell: bash
        run: |
          set -e
          for ex in \
            examples/complete-tutorial/01_basics/example01_hello.klx \
            examples/complete-tutorial/02_control_flow/example07_if_else.klx \
            examples/complete-tutorial/04_oop/example18_class_methods.klx \
            examples/complete-tutorial/07_stdlib_core/example29_basic_funcs.klx; do
            name=$(basename "$ex" .klx)
            ./kylix.exe build --backend=llvm -o "$name.exe" "$ex"
            "./$name.exe"
          done

      - name: "Regex engine (example61, multi-file pure-Kylix unit)"
        shell: bash
        run: |
          set -e
          ./kylix.exe build --backend=llvm -o ex61.exe \
            stdlib/regex_engine.klx \
            examples/complete-tutorial/23_regex/example61_regex_engine.klx
          ./ex61.exe > ex61_windows.txt
          # tutorial prints "T <pat> | <s>" on match, "F <pat> | <s>" on miss
          test "$(grep -c '^F ' ex61_windows.txt)" = "0"
          tail -1 ex61_windows.txt | grep -q "done"

      - name: "net smoke: two-process Winsock echo (real-machine acceptance)"
        # P1 acceptance on a real Windows environment: WSAStartup-once +
        # listen/accept/dial/write/read over the Winsock wrappers.
        shell: bash
        run: |
          set -e
          cat > net_listener.klx <<'EOF'
          program NetListener;
          uses net;
          begin
            var l := TcpListen(19733);
            if l = nil then begin WriteLn('listen failed'); exit; end;
            var c := TcpAccept(l);
            if c = nil then begin WriteLn('accept failed'); exit; end;
            var r := TcpRead(c, 64);
            TcpWrite(c, 'echo:' + r);
            TcpClose(c);
            TcpListenerClose(l);
            WriteLn('listener done');
          end.
          EOF
          cat > net_dialer.klx <<'EOF'
          program NetDialer;
          uses net;
          begin
            var c := TcpDial('127.0.0.1', 19733);
            if c = nil then begin WriteLn('dial failed'); exit; end;
            TcpWrite(c, 'hello');
            WriteLn(TcpRead(c, 64));
            TcpClose(c);
          end.
          EOF
          ./kylix.exe build --backend=llvm -o net_listener.exe net_listener.klx
          ./kylix.exe build --backend=llvm -o net_dialer.exe net_dialer.klx
          ./net_listener.exe &
          lpid=$!
          sleep 2
          ./net_dialer.exe
          wait $lpid

  selfrepro:
    name: Self-reproduction fixpoint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build CLI
        run: go build -o kylix ./cmd/kylix/

      - name: Bootstrap chain + fixpoint check
        run: |
          set -e
          # 1. Host compiler compiles src/*.klx → main.go → kylix_selfA
          ./kylix build src/*.klx
          go build -o kylix_selfA main.go
          # 2. kylix_selfA compiles src/*.klx → self_gen2.go → kylix_selfB
          ./kylix_selfA src/*.klx > self_gen2.go
          go build -o kylix_selfB ./self_gen2.go
          # 3. kylix_selfB compiles src/*.klx → self_gen3.go
          ./kylix_selfB src/*.klx > self_gen3.go
          # 4. Fixpoint: self_gen2 ≡ self_gen3 (byte-identical)
          cmp self_gen2.go self_gen3.go && echo "self-reproduction fixpoint OK"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt (tracked .go files, excluding generated examples/)
        run: |
          fmt_files=$(gofmt -l $(git ls-files '*.go' | grep -v '^examples/') 2>&1)
          if [ -n "$fmt_files" ]; then
            echo "Files not formatted:"
            echo "$fmt_files"
            exit 1
          fi
