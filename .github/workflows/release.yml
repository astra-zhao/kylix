name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target.os }}/${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { os: linux,   arch: amd64 }
          - { os: linux,   arch: arm64 }
          - { os: darwin,  arch: amd64 }
          - { os: darwin,  arch: arm64 }
          - { os: windows, arch: amd64 }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        env:
          GOOS:   ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -ldflags="-s -w" \
            -o "kylix-${GOOS}-${GOARCH}${ext}" \
            ./cmd/kylix/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kylix-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: kylix-${{ matrix.target.os }}-${{ matrix.target.arch }}*

  bootstrap:
    name: Bootstrap compiler (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-amd64 }
          - { os: macos-latest,  name: macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install LLVM toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libsqlite3-dev libcurl4-openssl-dev libssl-dev

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Build host CLI
        run: go build -o kylix-host ./cmd/kylix/

      # The bootstrap compiler: host-built once via the LLVM backend, then it is
      # a pure native binary with no Go dependency at runtime (v0.6.9 no-Go loop).
      - name: Build bootstrap compiler (main_self)
        run: |
          ./kylix-host build --backend=llvm -o main_self \
            src/token.klx src/error.klx src/ast.klx src/lexer.klx src/parser.klx \
            src/generator.klx src/stdlib_ir.klx src/llvmgen.klx src/main.klx

      - name: Smoke test (bootstrap → Go code → run)
        run: |
          ./main_self examples/complete-tutorial/01_basics/example01_hello.klx > hello_gen.go
          go run hello_gen.go

      - name: Package
        run: |
          mkdir -p dist
          cp main_self dist/
          cp docs/BOOTSTRAP_USAGE.md dist/USAGE.md
          tar -czf kylix-bootstrap-${{ matrix.name }}.tar.gz -C dist .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kylix-bootstrap-${{ matrix.name }}
          path: kylix-bootstrap-${{ matrix.name }}.tar.gz

  windows-toolchain:
    name: Windows LLVM toolchain (llvm-mingw UCRT)
    runs-on: ubuntu-latest
    steps:
      # Repackage mstorsjo/llvm-mingw's native-Windows toolchain as a release
      # asset: gives Windows users a working LLVM backend (llc/opt/clang +
      # mingw-w64 sysroot incl. ws2_32) with zero installation — bundles with
      # kylix.exe per FindLLVM's executable-adjacent llvm/bin lookup.
      - name: Fetch llvm-mingw (UCRT, runs on Windows x86_64)
        run: |
          curl -fL -o llvm-mingw-ucrt-x86_64.zip \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-x86_64.zip
          ls -la llvm-mingw-ucrt-x86_64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-mingw-ucrt-x86_64
          path: llvm-mingw-ucrt-x86_64.zip

  release:
    name: Create GitHub Release
    needs: [build, bootstrap, windows-toolchain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Extract release notes
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Take the section from CHANGELOG between this tag's heading and the next ##
          awk -v tag="$tag" '
            /^## / { if (found) exit; if ($0 ~ tag) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release_notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: Kylix ${{ steps.notes.outputs.tag }}
          body_path: release_notes.md
          files: release/*
          draft: false
          prerelease: false
