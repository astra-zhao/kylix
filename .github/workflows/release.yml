name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target.os }}/${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { os: linux,   arch: amd64 }
          - { os: linux,   arch: arm64 }
          - { os: darwin,  arch: amd64 }
          - { os: darwin,  arch: arm64 }
          - { os: windows, arch: amd64 }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        env:
          GOOS:   ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -ldflags="-s -w" \
            -o "kylix-${GOOS}-${GOARCH}${ext}" \
            ./cmd/kylix/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kylix-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: kylix-${{ matrix.target.os }}-${{ matrix.target.arch }}*

  bootstrap:
    name: Bootstrap compiler (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-amd64 }
          - { os: macos-latest,  name: macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install LLVM toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          # apt's LLVM 18 miscompiles the ~220k-line bootstrap IR (main_self
          # segfaults at startup; string constants garbled — see
          # TECHNICAL_DEBT.md). The bootstrap is validated on LLVM 19+;
          # macOS CI uses brew's current LLVM and is unaffected.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --yes -o /etc/apt/trusted.gpg.d/llvm.gpg
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update
          sudo apt-get install -y clang-19 llvm-19 gdb libsqlite3-dev libcurl4-openssl-dev libssl-dev
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Build host CLI
        run: go build -o kylix-host ./cmd/kylix/

      # The bootstrap compiler: host-built once via the LLVM backend, then it is
      # a pure native binary with no Go dependency at runtime (v0.6.9 no-Go loop).
      - name: Build bootstrap compiler (main_self)
        run: |
          # -g: DWARF symbols so the crash probe's backtrace maps to Kylix
          # source lines (run 6 gave bare function names only).
          ./kylix-host build --backend=llvm -g -o main_self \
            src/token.klx src/error.klx src/ast.klx src/lexer.klx src/parser.klx \
            src/generator.klx src/stdlib_ir.klx src/llvmgen.klx src/main.klx

      # The supported no-Go loop: bootstrap emits LLVM IR, llc/clang link a
      # native binary, run it. (The v0.5.x Go-codegen path is unverified since
      # v0.6.9 — see the diagnostic step below and TECHNICAL_DEBT.md.)
      # Smoke test, three probes in one round:
      #   1. plain run with unlimited stack — answers "is the run-3/4 segfault
      #      just the 8MB main-thread stack?" without gdb interference;
      #   2. on success the full no-Go loop continues (llc → clang → run);
      #   3. on failure, gdb with the args passed INSIDE `run` (gdb's `run >f`
      #      REPLACES the --args list — run 5 accidentally executed main_self
      #      with zero args, hence the misleading "default file list" output).
      - name: Smoke test (bootstrap IR → native binary → run)
        run: |
          ulimit -s unlimited 2>/dev/null || true  # macOS hard limit forbids it; fine — smoke passes there at 8MB
          set +e
          ./main_self --emit-llvm examples/complete-tutorial/01_basics/example01_hello.klx > hello.ll
          rc=$?
          set -e
          echo "plain run exit=$rc"
          wc -c hello.ll
          if [ "$rc" -ne 0 ] || [ ! -s hello.ll ]; then
            echo "::group::gdb backtrace (args passed inside run)"
            gdb -batch \
              -ex "run --emit-llvm examples/complete-tutorial/01_basics/example01_hello.klx > hello.ll" \
              -ex bt -ex "info registers rip rsp" \
              ./main_self
            echo "::endgroup::"
            wc -c hello.ll
            head -3 hello.ll || true
          fi
          llc -filetype=obj hello.ll -o hello.o
          clang hello.o -no-pie -lm -o hello_native
          ./hello_native

      # Crash probe (runs only when the smoke segfaulted): valgrind needs no
      # rebuild and reports the invalid access with the allocation site;
      # the -g build makes gdb's backtrace show Kylix source lines.
      - name: Crash probe (valgrind + gdb)
        if: failure()
        run: |
          set +e
          sudo apt-get install -y valgrind >/dev/null 2>&1
          echo "::group::duplicate defined symbols (vtable global collision?)"
          nm --defined-only main_self | awk '{print $NF}' | sort | uniq -d | head -20
          echo "vtable symbols in binary: $(nm --defined-only main_self | grep -c '_vtable$')  (IR defines 72)"
          echo "::endgroup::"
          echo "::group::valgrind (invalid access + allocation site)"
          valgrind --track-origins=yes --num-callers=25 \
            ./main_self --emit-llvm examples/complete-tutorial/01_basics/example01_hello.klx > /dev/null
          echo "valgrind exit=$?"
          echo "::endgroup::"
          echo "::group::gdb: walk the Statements loop, dump each node + its vtable global"
          # DWARF attributed these source lines to stdlib_ir.klx (merge quirk);
          # line numbers match llvmgen.klx:1144-1160.
          gdb -batch \
            -ex "break stdlib_ir.klx:1147" \
            -ex run \
            -ex "commands 1" \
            -ex "silent" \
            -ex "printf \"== pi=%d i=%d\\n\", pi, i" \
            -ex "p p" \
            -ex "p decl" \
            -ex "x/10gx decl" \
            -ex "info symbol *(void **)decl" \
            -ex "continue" \
            -ex "end" \
            -ex bt \
            -ex continue \
            --args ./main_self --emit-llvm examples/complete-tutorial/01_basics/example01_hello.klx
          echo "::endgroup::"

      # Diagnostic only (non-fatal): the bootstrap's Go-codegen path produced
      # corrupted output on Linux CI (quote-containing string constants
      # garbled, e.g. `fmt.Println("...")` → `@p[ :=`), while macOS is fine.
      # Not part of the v0.6.9 no-Go loop; investigation tracked in
      # TECHNICAL_DEBT.md.
      - name: Diagnostic (Go codegen path, non-fatal)
        if: always()
        run: |
          ./main_self examples/complete-tutorial/01_basics/example01_hello.klx > hello_gen.go || true
          wc -c hello_gen.go || true
          head -20 hello_gen.go || true

      - name: Diagnostic (smoke failure artifacts)
        if: failure()
        run: |
          wc -c hello.ll || true
          head -5 hello.ll || true
          file main_self || true
          ls -la main_self hello.ll hello.o hello_native 2>/dev/null || true
          /usr/lib/llvm-19/bin/llc --version 2>/dev/null | head -2 || llc --version | head -2

      - name: Package
        run: |
          mkdir -p dist
          cp main_self dist/
          cp docs/BOOTSTRAP_USAGE.md dist/USAGE.md
          tar -czf kylix-bootstrap-${{ matrix.name }}.tar.gz -C dist .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kylix-bootstrap-${{ matrix.name }}
          path: kylix-bootstrap-${{ matrix.name }}.tar.gz

  windows-toolchain:
    name: Windows LLVM toolchain (llvm-mingw UCRT)
    runs-on: ubuntu-latest
    steps:
      # Repackage mstorsjo/llvm-mingw's native-Windows toolchain as a release
      # asset: gives Windows users a working LLVM backend (llc/opt/clang +
      # mingw-w64 sysroot incl. ws2_32) with zero installation — bundles with
      # kylix.exe per FindLLVM's executable-adjacent llvm/bin lookup.
      - name: Fetch llvm-mingw (UCRT, runs on Windows x86_64)
        run: |
          curl -fL -o llvm-mingw-ucrt-x86_64.zip \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-x86_64.zip
          ls -la llvm-mingw-ucrt-x86_64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-mingw-ucrt-x86_64
          path: llvm-mingw-ucrt-x86_64.zip

  release:
    name: Create GitHub Release
    needs: [build, bootstrap, windows-toolchain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Extract release notes
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Take the section from CHANGELOG between this tag's heading and the next ##
          awk -v tag="$tag" '
            /^## / { if (found) exit; if ($0 ~ tag) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release_notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: Kylix ${{ steps.notes.outputs.tag }}
          body_path: release_notes.md
          files: release/*
          draft: false
          prerelease: false
